name: Benji checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/package_session_skill.py
      - name: Check the downloadable skill matches its sources
        run: git diff --exit-code -- downloads/benji.zip
